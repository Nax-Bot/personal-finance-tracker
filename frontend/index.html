<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <meta name="description" content="Personal tracker for accounts, income, expenses and budgets.">
    <title>Finances — Dashboard</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script defer src="assets/js/config.js"></script>
    <script defer src="assets/js/api.js"></script>
    <script defer src="assets/js/app.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Main navigation">
            <a class="brand" href="#dashboard" data-view="dashboard" aria-label="Personal Finance Tracker, home">
                <span class="brand-mark" aria-hidden="true">PF</span>
                <span class="brand-copy"><strong>Finances</strong><small>Personal tracker</small></span>
            </a>

            <p class="nav-caption">PERSONAL SPACE</p>
            <nav class="primary-nav">
                <button class="nav-link is-active" type="button" data-view="dashboard"><span class="nav-icon" aria-hidden="true">⌂</span>Dashboard</button>
                <button class="nav-link" type="button" data-view="transactions"><span class="nav-icon" aria-hidden="true">↕</span>Transactions</button>
                <button class="nav-link" type="button" data-view="accounts"><span class="nav-icon" aria-hidden="true">▣</span>Accounts</button>
                <button class="nav-link" type="button" data-view="categories"><span class="nav-icon" aria-hidden="true">◷</span>Categories</button>
                <button class="nav-link" type="button" data-view="summary"><span class="nav-icon" aria-hidden="true">▤</span>Monthly summary</button>
            </nav>
        </aside>

        <div class="workspace">
            <header class="topbar">
                <div class="breadcrumb"><span class="breadcrumb-dot" aria-hidden="true"></span><span id="topbar-section">Overview</span></div>
            </header>

            <main id="main-content" class="main-content" tabindex="-1" aria-live="polite">
                <div class="loading-panel"><span class="spinner" aria-hidden="true"></span><p>Loading your data…</p></div>
            </main>

            <footer class="mobile-footer">Personal Finance Tracker</footer>
        </div>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="mobile-nav-link is-active" type="button" data-view="dashboard"><span aria-hidden="true">⌂</span><small>Home</small></button>
        <button class="mobile-nav-link" type="button" data-view="transactions"><span aria-hidden="true">↕</span><small>Activity</small></button>
        <button class="mobile-nav-link" type="button" data-view="accounts"><span aria-hidden="true">▣</span><small>Accounts</small></button>
        <button class="mobile-nav-link" type="button" data-view="categories"><span aria-hidden="true">◷</span><small>Budgets</small></button>
        <button class="mobile-nav-link" type="button" data-view="summary"><span aria-hidden="true">▤</span><small>Summary</small></button>
    </nav>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
